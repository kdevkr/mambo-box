<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="gdGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="eventGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-gd" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-alert" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="520" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc" letter-spacing="0.5">Amazon GuardDuty 감사 및 위협 탐지 흐름</text>
  <text x="520" y="62" text-anchor="middle" font-size="12" fill="#94a3b8">로그 감사부터 EC2 / ECS 런타임 모니터링, EventBridge 기반 자동 완화 조치까지의 구성</text>

  <!-- Step 1: Data Sources & Workload Monitoring -->
  <g transform="translate(35, 88)">
    <rect width="225" height="385" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="225" height="38" rx="10" fill="#0284c7" opacity="0.15"/>
    <text x="112" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#38bdf8">1. 로그 감사 및 워크로드 모니터링</text>

    <!-- VPC Flow Logs -->
    <g transform="translate(12, 50)">
      <rect width="201" height="52" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="12" y="22" font-size="12" font-weight="600" fill="#e2e8f0">VPC Flow Logs</text>
      <text x="12" y="38" font-size="10" fill="#94a3b8">VPC 내 네트워크 트래픽 감사</text>
    </g>

    <!-- CloudTrail -->
    <g transform="translate(12, 112)">
      <rect width="201" height="52" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="12" y="22" font-size="12" font-weight="600" fill="#e2e8f0">AWS CloudTrail</text>
      <text x="12" y="38" font-size="10" fill="#94a3b8">API 호출 및 사용자 활동 감사</text>
    </g>

    <!-- EC2 Monitoring -->
    <g transform="translate(12, 174)">
      <rect width="201" height="60" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1"/>
      <text x="12" y="22" font-size="12" font-weight="600" fill="#bfdbfe">EC2 모니터링</text>
      <text x="12" y="38" font-size="10" fill="#94a3b8">• 런타임 위협 탐지 (프로세스·파일)</text>
      <text x="12" y="52" font-size="10" fill="#94a3b8">• Malware Protection (EBS 스캔)</text>
    </g>

    <!-- ECS Monitoring -->
    <g transform="translate(12, 244)">
      <rect width="201" height="60" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1"/>
      <text x="12" y="22" font-size="12" font-weight="600" fill="#bfdbfe">ECS 모니터링</text>
      <text x="12" y="38" font-size="10" fill="#94a3b8">• Fargate 및 EC2 클러스터 런타임</text>
      <text x="12" y="52" font-size="10" fill="#94a3b8">• 파일 액세스·컨테이너 프로세스 분석</text>
    </g>

    <!-- DNS Logs -->
    <g transform="translate(12, 314)">
      <rect width="201" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" font-size="12" font-weight="600" fill="#e2e8f0">DNS Query Logs</text>
      <text x="12" y="38" font-size="10" fill="#94a3b8">악성 도메인 쿼리 분석</text>
    </g>
  </g>

  <!-- Connectors Step 1 -> Step 2 -->
  <path d="M 260 164 L 325 280" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 260 226 L 325 280" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 260 294 L 325 280" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 260 364 L 325 280" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 260 428 L 325 280" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: GuardDuty Analysis -->
  <g transform="translate(330, 120)">
    <rect width="220" height="320" rx="10" fill="#1e293b" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
    <rect width="220" height="38" rx="10" fill="#7c3aed" opacity="0.25"/>
    <text x="110" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#c4b5fd">2. 위협 탐지 및 분석 엔진</text>

    <!-- Core Box -->
    <g transform="translate(15, 52)">
      <rect width="190" height="90" rx="6" fill="url(#gdGrad)"/>
      <text x="95" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Amazon GuardDuty</text>
      <text x="95" y="48" text-anchor="middle" font-size="11" fill="#ede9fe">지능형 분석 엔진 (Agentless)</text>
      <text x="95" y="66" text-anchor="middle" font-size="11" fill="#ede9fe">경량 보안 에이전트 (런타임)</text>
      <text x="95" y="82" text-anchor="middle" font-size="10" fill="#ddd6fe">ML 이상 탐지 모델</text>
    </g>

    <!-- Threat Intelligence -->
    <g transform="translate(15, 154)">
      <rect width="190" height="145" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="12" y="22" font-size="11" font-weight="700" fill="#a78bfa">위협 인텔리전스 및 탐지</text>
      <text x="12" y="42" font-size="10" fill="#94a3b8">• AWS Threat Intelligence</text>
      <text x="12" y="60" font-size="10" fill="#94a3b8">• CrowdStrike / Proofpoint 피드</text>
      <text x="12" y="78" font-size="10" fill="#94a3b8">• 비정상 권한 상승 탐지</text>
      <text x="12" y="96" font-size="10" fill="#94a3b8">• 암호화폐 채굴(Cryptomining)</text>
      <text x="12" y="114" font-size="10" fill="#94a3b8">• 자격증명 유출 행위 식별</text>
      <text x="12" y="132" font-size="10" fill="#94a3b8">• C&amp;C 악성 통신 차단 권고</text>
    </g>
  </g>

  <!-- Connector Step 2 -> Step 3 -->
  <path d="M 550 280 L 595 280" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-gd)"/>
  <text x="572" y="270" text-anchor="middle" font-size="10" font-weight="600" fill="#a78bfa">Findings</text>

  <!-- Step 3: EventBridge Routing -->
  <g transform="translate(600, 120)">
    <rect width="195" height="320" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="195" height="38" rx="10" fill="#f59e0b" opacity="0.15"/>
    <text x="97" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#fbbf24">3. 실시간 이벤트 라우팅</text>

    <!-- EventBridge Box -->
    <g transform="translate(15, 52)">
      <rect width="165" height="66" rx="6" fill="url(#eventGrad)"/>
      <text x="82" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Amazon EventBridge</text>
      <text x="82" y="48" text-anchor="middle" font-size="11" fill="#fef3c7">이벤트 기반 자동화 버스</text>
    </g>

    <!-- Severity Filter Box -->
    <g transform="translate(15, 130)">
      <rect width="165" height="168" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="12" y="22" font-size="11" font-weight="700" fill="#fde68a">심각도(Severity) 필터링</text>
      <text x="12" y="46" font-size="11" fill="#ef4444">■ High (7.0 ~ 8.9)</text>
      <text x="24" y="62" font-size="10" fill="#fca5a5">리소스 침해 즉각 조치</text>
      <text x="12" y="86" font-size="11" fill="#f59e0b">■ Medium (4.0 ~ 6.9)</text>
      <text x="24" y="102" font-size="10" fill="#fcd34d">의심 동작 조사</text>
      <text x="12" y="126" font-size="11" fill="#10b981">■ Low (0.1 ~ 3.9)</text>
      <text x="24" y="142" font-size="10" fill="#86efac">보안 상태 모니터링</text>
    </g>
  </g>

  <!-- Connectors Step 3 -> Step 4 -->
  <path d="M 795 240 L 840 215" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-alert)"/>
  <path d="M 795 280 L 840 280" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-alert)"/>
  <path d="M 795 320 L 840 345" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-alert)"/>

  <!-- Step 4: Actions & Remediation -->
  <g transform="translate(845, 120)">
    <rect width="160" height="320" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="160" height="38" rx="10" fill="#10b981" opacity="0.15"/>
    <text x="80" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#34d399">4. 대응 및 알림</text>

    <!-- SNS / Slack -->
    <g transform="translate(12, 52)">
      <rect width="136" height="66" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="24" font-size="12" font-weight="600" fill="#e2e8f0">Amazon SNS</text>
      <text x="10" y="42" font-size="10" fill="#94a3b8">• Slack 웹훅 연동</text>
      <text x="10" y="56" font-size="10" fill="#94a3b8">• 관리자 이메일 알림</text>
    </g>

    <!-- AWS Lambda -->
    <g transform="translate(12, 130)">
      <rect width="136" height="80" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="24" font-size="12" font-weight="600" fill="#6ee7b7">AWS Lambda</text>
      <text x="10" y="42" font-size="10" fill="#94a3b8">• 격리 보안 그룹 적용</text>
      <text x="10" y="58" font-size="10" fill="#94a3b8">• IAM 세션 즉시 취소</text>
      <text x="10" y="72" font-size="10" fill="#94a3b8">• EC2/컨테이너 자동 격리</text>
    </g>

    <!-- Security Hub -->
    <g transform="translate(12, 222)">
      <rect width="136" height="66" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="24" font-size="12" font-weight="600" fill="#e2e8f0">AWS Security Hub</text>
      <text x="10" y="42" font-size="10" fill="#94a3b8">• 통합 보안 대시보드</text>
      <text x="10" y="56" font-size="10" fill="#94a3b8">• 규정 준수 현황 추적</text>
    </g>
  </g>
</svg>
