services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    ports:
      - "8123:8123" # HTTP 인터페이스
      - "9000:9000" # 네이티브 클라이언트 인터페이스
      - "9440:9440" # 보안 네이티브 클라이언트 인터페이스
    volumes:
      - ./data:/var/lib/clickhouse # 데이터 영구 저장
      - ./logs:/var/log/clickhouse # 로그 저장
      - ./config:/etc/clickhouse-server # 사용자 설정 (필요 시)
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=mambo
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
